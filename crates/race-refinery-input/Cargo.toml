[package]
name = "race-refinery-input"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Background game-controller button bindings (wheels, button boxes)"

[dependencies]
race-refinery-settings = { path = "../race-refinery-settings" }
parking_lot = "0.12"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_System_LibraryLoader",
] }
