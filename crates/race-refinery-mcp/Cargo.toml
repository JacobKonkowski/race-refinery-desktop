[package]
name = "race-refinery-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "In-app read-only MCP server for Race Refinery session data"

[dependencies]
anyhow = "1"
axum = "0.8"
parking_lot = "0.12"
race-refinery-analysis = { path = "../race-refinery-analysis" }
race-refinery-storage = { path = "../race-refinery-storage" }
rmcp = { version = "3.10", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
