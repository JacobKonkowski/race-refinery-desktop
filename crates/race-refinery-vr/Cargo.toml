[package]
name = "race-refinery-vr"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "In-headset HUD for iRacing VR"

[dependencies]
race-refinery-analysis = { path = "../race-refinery-analysis" }
race-refinery-live = { path = "../race-refinery-live" }
race-refinery-settings = { path = "../race-refinery-settings" }
race-refinery-storage = { path = "../race-refinery-storage" }
anyhow = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Security",
] }
