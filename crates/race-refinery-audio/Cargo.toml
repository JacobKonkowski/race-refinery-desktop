[package]
name = "race-refinery-audio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Audio coach: human-recorded voice packs, clip stitching, and the Voice Studio recorder"

[dependencies]
race-refinery-live = { path = "../race-refinery-live" }
race-refinery-settings = { path = "../race-refinery-settings" }
anyhow = "1"
cpal = "0.15"
hound = "3.5"
parking_lot = "0.12"
rodio = { version = "0.22", default-features = false, features = ["wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
