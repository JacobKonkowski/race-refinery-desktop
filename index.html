<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Race Refinery</title>
    <style>
      /* First paint before the JS bundle — keep in sync with --color-bg (#0b0e14). */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      html,
      body {
        background: #0b0e14;
        color: #e6edf3;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
          sans-serif;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #0b0e14;
        opacity: 1;
        transition: opacity 280ms ease;
        pointer-events: none;
      }

      #boot-splash.boot-splash--exit {
        opacity: 0;
      }

      .boot-splash-mark {
        margin: 0;
        font-size: 48px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #e6edf3;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Loading Race Refinery">
      <p class="boot-splash-mark">RR</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
