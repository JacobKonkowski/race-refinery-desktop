<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Race Refinery</title>
    <style>
      /* First paint before the JS bundle — keep in sync with --color-bg (#0b0e14). */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      html,
      body {
        background: #0b0e14;
        color: #e6edf3;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
          sans-serif;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse 80% 55% at 50% 38%, #12161f 0%, #0b0e14 68%),
          #0b0e14;
        opacity: 1;
        transition: opacity 280ms ease;
        pointer-events: none;
      }

      #boot-splash.boot-splash--exit {
        opacity: 0;
      }

      .boot-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        animation: boot-rise 480ms ease-out both;
      }

      .boot-splash-icon {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        animation: boot-glow 1.6s ease-in-out infinite;
      }

      .boot-splash-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .boot-splash-mark {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.4px;
        color: #4aa3ff;
      }

      .boot-splash-sub {
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.2px;
        color: #5b6472;
      }

      .boot-splash-bar {
        width: 148px;
        height: 2px;
        margin-top: 6px;
        border-radius: 999px;
        background: #262d3a;
        overflow: hidden;
      }

      .boot-splash-bar > span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, #1f6feb, #4aa3ff);
        animation: boot-sweep 1.1s ease-in-out infinite;
      }

      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes boot-glow {
        0%,
        100% {
          filter: brightness(1);
        }
        50% {
          filter: brightness(1.12);
        }
      }

      @keyframes boot-sweep {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(280%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-splash-inner,
        .boot-splash-icon,
        .boot-splash-bar > span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Loading Race Refinery">
      <div class="boot-splash-inner">
        <img class="boot-splash-icon" src="/app-icon.png" alt="" width="72" height="72" />
        <div class="boot-splash-brand">
          <span class="boot-splash-mark">Race Refinery</span>
          <span class="boot-splash-sub">race telemetry</span>
        </div>
        <div class="boot-splash-bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
