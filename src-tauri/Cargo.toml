[package]
name = "race-refinery-desktop"
version = "0.1.0"
description = "Post-session iRacing telemetry analysis"
authors = ["Race Refinery"]
license.workspace = true
edition = "2021"
default-run = "race-refinery-desktop"

[lib]
name = "race_refinery_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["vr"]
# OpenXR layer packaging / native HUD paths. Disable for lighter contributor builds.
vr = []
# In-app updater (requires signing keys + endpoints — see docs/RELEASING.md).
updater = ["dep:tauri-plugin-updater"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = { version = "2", optional = true }
pitwall = { version = "0.1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

race-refinery-telemetry = { path = "../crates/race-refinery-telemetry" }
race-refinery-analysis = { path = "../crates/race-refinery-analysis" }
race-refinery-settings = { path = "../crates/race-refinery-settings" }
race-refinery-storage = { path = "../crates/race-refinery-storage" }
race-refinery-ingest = { path = "../crates/race-refinery-ingest" }
race-refinery-live = { path = "../crates/race-refinery-live" }
race-refinery-audio = { path = "../crates/race-refinery-audio" }
race-refinery-vr = { path = "../crates/race-refinery-vr" }
race-refinery-monitor = { path = "../crates/race-refinery-monitor" }
race-refinery-input = { path = "../crates/race-refinery-input" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Security",
] }
